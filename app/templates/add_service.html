<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Serviço - Agendify</title>
</head>
<body>
    <h2>Adicionar Novo Serviço</h2>
    
    <form method="POST">
        <label>Nome do Serviço:</label><br>
        <input type="text" name="nome" required><br><br>
        
        <label>Descrição:</label><br>
        <textarea name="descricao" rows="3"></textarea><br><br>
        
        <label>Preço (€):</label><br>
        <input type="number" step="0.01" name="preco" required><br><br>
        
        <label>Duração (em minutos):</label><br>
        <input type="number" name="duracao" value="30" required><br><br>
        
        <button type="submit">Guardar Serviço</button>
    </form>
    
    <br>
    <p><a href="{{ url_for('services.list_services') }}">Cancelar</a></p>
</body>
</html>
