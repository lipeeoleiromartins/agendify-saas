{% extends "base.html" %}

{% block title %}Adicionar Serviço - Agendify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-6">
        <div class="card p-4 shadow-lg border-secondary bg-dark">
            <h2 class="fw-bold mb-4 text-center">Adicionar Novo Serviço</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Serviço:</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição:</label>
                    <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">Preço (€):</label>
                    <input type="number" step="0.01" class="form-control" id="preco" name="preco" required>
                </div>

                <div class="mb-3">
                    <label for="duracao" class="form-label">Duração (em minutos):</label>
                    <input type="number" class="form-control" id="duracao" name="duracao" value="30" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="javascript:history.back()" class="text-muted text-decoration-none">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4">Guardar Serviço</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
