<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Novo Agendamento - Agendify</title>
</head>
<body>
    <h2>Criar Novo Agendamento</h2>
    
    <form method="POST">
        <label>Cliente:</label><br>
        <select name="client_id" required>
            <option value="">Seleciona um cliente...</option>
            {% for cliente in clientes %}
                <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
            {% endfor %}
        </select><br><br>
        
        <label>Serviço:</label><br>
        <select name="service_id" required>
            <option value="">Seleciona um serviço...</option>
            {% for servico in servicos %}
                <option value="{{ servico.id }}">{{ servico.nome }} - {{ servico.preco }}€ ({{ servico.duracao_minutos }} min)</option>
            {% endfor %}
        </select><br><br>
        
        <label>Data e Hora:</label><br>
        <input type="datetime-local" name="data_hora" required><br><br>
        
        <button type="submit">Confirmar Agendamento</button>
    </form>
    
    <br>
    <p><a href="{{ url_for('appointments.list_appointments') }}">Cancelar</a></p>
</body>
</html>
