{% extends "base.html" %}

{% block title %}Novo Agendamento - Agendify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-6">
        <div class="card p-4 shadow-lg border-secondary bg-dark text-light">
            <h2 class="fw-bold mb-4 text-center">Criar Novo Agendamento</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="client_id" class="form-label">Cliente:</label>
                    <select class="form-control" id="client_id" name="client_id" required>
                        <option value="" disabled selected>Seleciona um cliente...</option>
                        {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="service_id" class="form-label">Serviço:</label>
                    <select class="form-control" id="service_id" name="service_id" required>
                        <option value="" disabled selected>Seleciona um serviço...</option>
                        {% for service in services %}
                            <option value="{{ service.id }}">{{ service.nome }} - €{{ service.preco }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="data_hora" class="form-label">Data e Hora:</label>
                    <input type="datetime-local" class="form-control" id="data_hora" name="data_hora" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="javascript:history.back()" class="text-muted text-decoration-none">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4">Confirmar Agendamento</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
