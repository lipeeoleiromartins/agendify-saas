<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Agendify</title>
</head>
<body>
    <h2>Iniciar Sessão no Agendify</h2>
    
    <!-- Mensagens Flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div style="color: {% if category == 'danger' %}red{% else %}green{% endif %}; margin-bottom: 10px;">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
        
    <form method="POST">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        
        <label>Palavra-passe:</label><br>
        <input type="password" name="senha" required><br><br>
        
        <button type="submit">Entrar</button>
    </form>
    
    <p>Ainda não tens conta? <a href="{{ url_for('auth.register') }}">Registar-te</a></p>
</body>
</html>
