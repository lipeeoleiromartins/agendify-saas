{% extends "base.html" %}

{% block title %}Adicionar Cliente - Agendify{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-6">
        <div class="card p-4 shadow-lg border-secondary bg-dark">
            <h2 class="fw-bold mb-4 text-center">Adicionar Novo Cliente</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="text" class="form-control" id="telefone" name="telefone" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="javascript:history.back()" class="text-muted text-decoration-none">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
